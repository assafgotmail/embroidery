[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embroidery"
version = "0.1.0"
description = "Paint with Thread project generator: image -> trace pattern, DMC palette, and embroidery guide"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "scikit-image",
    "scikit-learn",
    "shapely",
    "jinja2",
    "playwright",
]

[project.scripts]
embroider = "embroidery.cli:main"

[tool.setuptools]
packages = ["embroidery"]

[tool.setuptools.package-data]
embroidery = ["../data/*.csv", "../templates/**/*"]
